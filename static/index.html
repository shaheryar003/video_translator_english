<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Translate AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --secondary-text: #a0a0a0;
            --accent-color: #00d2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--secondary-text);
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .upload-area {
            border: 2px dashed var(--glass-border);
            border-radius: 15px;
            padding: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover, .upload-area.dragover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-color);
        }

        .upload-icon {
            font-size: 4rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
            display: block;
        }

        .upload-text {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .upload-subtext {
            font-size: 0.9rem;
            color: var(--secondary-text);
            margin-top: 0.5rem;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background: #555;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 2rem;
            display: none;
            text-align: left;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            background: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--secondary-text);
            display: flex;
            justify-content: space-between;
        }

        /* Result Area */
        .result-area {
            margin-top: 2rem;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        video {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>VideoTranslator</h1>
            <p class="subtitle">AI-powered video translation and dubbing</p>

            <div class="upload-area" id="uploadArea">
                <span class="upload-icon">☁️</span>
                <div class="upload-text">Drag & Drop video here</div>
                <div class="upload-subtext">or click to browse (MP4 only)</div>
                <input type="file" id="fileInput" accept="video/mp4">
            </div>

            <button id="uploadBtn" class="btn" style="display: none;">Start Processing</button>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="status-text">
                    <span id="statusMessage"><div class="loader"></div> Processing logic initiated...</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="result-area" id="resultArea">
                <h3>Translation Complete!</h3>
                <video id="videoResult" controls>
                    Your browser does not support the video tag.
                </video>
                <a id="downloadLink" href="#" class="btn" download>Download Video</a>
                <button id="newVideoBtn" class="btn" style="background: transparent; border: 1px solid white; margin-left: 10px;">Translate Another</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const resultArea = document.getElementById('resultArea');
        const videoResult = document.getElementById('videoResult');
        const downloadLink = document.getElementById('downloadLink');
        const errorMessage = document.getElementById('errorMessage');
        const newVideoBtn = document.getElementById('newVideoBtn');

        let selectedFile = null;

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            uploadArea.classList.add('dragover');
        }

        function unhighlight() {
            uploadArea.classList.remove('dragover');
        }

        uploadArea.addEventListener('drop', handleDrop, false);
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFiles);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles({ target: { files: files } });
        }

        function handleFiles(e) {
            const files = e.target.files;
            if (files.length > 0) {
                if (files[0].type !== 'video/mp4') {
                    showError("Please upload an MP4 video file.");
                    return;
                }
                selectedFile = files[0];
                document.querySelector('.upload-text').textContent = selectedFile.name;
                document.querySelector('.upload-subtext').textContent = formatBytes(selectedFile.size);
                uploadBtn.style.display = 'inline-block';
                errorMessage.style.display = 'none';
            }
        }

        uploadBtn.addEventListener('click', uploadFormat);

        function uploadFormat() {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            // UI Updates
            uploadArea.style.display = 'none';
            uploadBtn.style.display = 'none';
            progressContainer.style.display = 'block';
            errorMessage.style.display = 'none';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                } else {
                    pollStatus(data.task_id);
                }
            })
            .catch(error => {
                showError("Upload failed: " + error.message);
            });
        }

        function pollStatus(taskId) {
            let progress = 0;
            const interval = setInterval(() => {
                fetch(`/status/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'processing' || data.status === 'queued') {
                        statusMessage.innerHTML = `<div class="loader"></div> ${data.message || 'Processing...'}`;
                        // Fake progress for UX since we don't have real progress from backend yet
                        if (progress < 90) progress += (Math.random() * 2);
                        progressBar.style.width = `${Math.min(progress, 90)}%`;
                        document.getElementById('progressPercent').textContent = `${Math.round(Math.min(progress, 90))}%`;
                    } else if (data.status === 'completed') {
                        clearInterval(interval);
                        progressBar.style.width = '100%';
                        document.getElementById('progressPercent').textContent = '100%';
                        showResult(data.file_url);
                        statusMessage.textContent = "Done!";
                    } else if (data.status === 'failed') {
                        clearInterval(interval);
                        showError(data.message || "Processing failed.");
                    }
                })
                .catch(err => {
                    console.error("Polling error", err);
                });
            }, 2000);
        }

        function showResult(url) {
            progressContainer.style.display = 'none';
            resultArea.style.display = 'block';
            videoResult.src = url;
            downloadLink.href = url;
            downloadLink.download = `translated_${selectedFile.name}`;
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            progressContainer.style.display = 'none';
            uploadArea.style.display = 'block';
        }

        newVideoBtn.addEventListener('click', () => {
             resultArea.style.display = 'none';
             uploadArea.style.display = 'block';
             document.querySelector('.upload-text').textContent = "Drag & Drop video here";
             document.querySelector('.upload-subtext').textContent = "or click to browse (MP4 only)";
             fileInput.value = '';
             selectedFile = null;
        });

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
